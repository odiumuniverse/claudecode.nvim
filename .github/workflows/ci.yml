name: CI

# The Lua jobs of upstream's test.yml, without release tooling and coverage summary.
# A separate file so that rebasing onto upstream never conflicts here.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Build deps: PUC Lua builds from source, and the test rocks compile C modules.
      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libreadline-dev unzip

      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Cache Lua test rocks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .luarocks
          key: luarocks-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install Lua test rocks
        run: mise run setup

      - name: Run luacheck
        run: mise run check

      - name: Run tests
        run: mise run test

      - name: Check formatting
        run: mise run format-check

  # Specs in spec/ need a real Neovim (vim.text.diff, extmarks), so they run apart from the
  # mock-vim unit tests above.
  nvim-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y build-essential libreadline-dev unzip

      - name: Set up mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0

      - name: Cache Lua test rocks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .luarocks
          key: luarocks-${{ runner.os }}-${{ hashFiles('mise.toml') }}

      - name: Install Lua test rocks
        run: mise run setup

      - name: Run specs in headless Neovim
        run: scripts/test-nvim.sh

      - name: Run luacheck on specs
        run: ./.luarocks/bin/luacheck spec/ --no-unused-args --no-max-line-length

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Neovim pinned in mise.toml, as in the jobs above. rhysd/action-setup-vim broke on the
      # Ubuntu 26 runners (EXDEV renaming its download across devices).
      - name: Set up Neovim with mise
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: neovim

      - name: Install test dependencies
        run: |
          git clone --depth 1 https://github.com/nvim-lua/plenary.nvim ~/.local/share/nvim/site/pack/vendor/start/plenary.nvim
          ln -s "$(pwd)" ~/.local/share/nvim/site/pack/vendor/start/claudecode.nvim

      - name: Run integration tests
        run: ./scripts/run_integration_tests_individually.sh

      - name: Reject-on-quit regression gate (#238)
        run: nvim --headless -u NONE -l scripts/repro_issue_238.lua
